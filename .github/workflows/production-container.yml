name: production-container

on:
  push:
    branches:
      - feature/v2.1-production-hardening
  pull_request:
    branches:
      - feature/v2.1-production-hardening

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build -f infra/docker/Dockerfile -t apex-vision-ai:${{ github.sha }} .

      - name: Smoke test image
        run: |
          docker run -d --name apex-smoke -p 8000:8000 apex-vision-ai:${{ github.sha }}
          trap 'docker logs apex-smoke; docker rm -f apex-smoke' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1
