name: production-container

on:
  push:
    branches:
      - feature/v2.1-production-hardening
  pull_request:
    branches:
      - feature/v2.1-production-hardening

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run backend tests
        env:
          APEX_AI_PROVIDER: light
          APEX_DEBUG: "true"
        run: pytest -q

  frontend-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  container:
    needs: [backend-tests, frontend-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build production image
        run: docker build -f infra/docker/Dockerfile -t apex-vision-ai:${{ github.sha }} .
      - name: Smoke test image
        run: |
          docker run -d --name apex-smoke -p 8000:8000 \
            -e APEX_AI_PROVIDER=light \
            -e APEX_DEBUG=false \
            -e APEX_CORS_ORIGINS=http://127.0.0.1:8000 \
            apex-vision-ai:${{ github.sha }}
          trap 'docker logs apex-smoke; docker rm -f apex-smoke' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then
              curl --fail --silent http://127.0.0.1:8000/api/ready
              curl --fail --silent http://127.0.0.1:8000/api/diagnostics
              exit 0
            fi
            sleep 2
          done
          exit 1
