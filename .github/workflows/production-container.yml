name: APEX Vision AI v2.3 AI Accuracy Validation

on:
  push:
    branches:
      - feature/v2.1-production-hardening
  pull_request:
    branches:
      - feature/v2.1-production-hardening
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apex-v23-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  backend-tests:
    name: Backend tests, performance and AI quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run full test suite
        env:
          APEX_AI_PROVIDER: light
          APEX_DEBUG: "true"
        run: pytest -q --maxfail=1
      - name: Run performance baseline
        env:
          APEX_AI_PROVIDER: light
          APEX_DEBUG: "true"
        run: pytest -q tests/test_performance.py
      - name: Run AI quality regression gate
        env:
          APEX_AI_PROVIDER: light
          APEX_DEBUG: "true"
        run: pytest -q tests/test_scene_quality.py
      - name: Validate material benchmark contract
        run: python scripts/validate_material_benchmark.py --output material-benchmark-summary.json
      - name: Upload benchmark contract report
        uses: actions/upload-artifact@v4
        with:
          name: material-benchmark-contract-${{ github.sha }}
          path: material-benchmark-summary.json
          if-no-files-found: error
          retention-days: 14

  frontend-validation:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  container:
    name: Production container smoke test
    needs: [backend-tests, frontend-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build production image
        run: docker build -f infra/docker/Dockerfile -t apex-vision-ai:${{ github.sha }} .
      - name: Start container
        run: |
          docker run -d --name apex-smoke -p 8000:8000 \
            -e APEX_AI_PROVIDER=light \
            -e APEX_DEBUG=false \
            -e APEX_CORS_ORIGINS=http://127.0.0.1:8000 \
            apex-vision-ai:${{ github.sha }}
      - name: Smoke test health and readiness
        run: |
          set -e
          trap 'docker logs apex-smoke; docker rm -f apex-smoke' EXIT
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/api/health
          curl --fail --silent http://127.0.0.1:8000/api/ready
          curl --fail --silent http://127.0.0.1:8000/api/diagnostics
          docker inspect --format '{{.State.Status}}' apex-smoke | grep -qx running
      - name: Cleanup
        if: always()
        run: docker rm -f apex-smoke || true
